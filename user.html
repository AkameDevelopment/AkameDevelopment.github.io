<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzerprofil · AkameDevelopment</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261112-purple-anime-large-2"><link rel="shortcut icon" href="favicon.svg?v=20261112-purple-anime-large-2"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#0c0b10 0%,#15101e 50%,#100d16 100%);color:#f7f2ff;font:15px/1.6 system-ui,sans-serif}header{padding:20px max(24px,calc((100vw - 850px)/2));border-bottom:1px solid #ffffff20}a{color:#cba5ff;text-decoration:none}main{max-width:850px;margin:60px auto;padding:0 24px}.card{border:1px solid #a480d544;border-radius:20px;padding:30px;background:#1b1427}.person{display:flex;align-items:center;gap:20px}.person img{width:86px;height:86px;border-radius:22px;background:#2c2040}h1{margin:0;font-size:32px}.muted{color:#b4a4c8}.bio{white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:5px 12px;border-radius:20px;background:#4b2d68;margin:10px 8px 0 0} .gallery-public{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gallery-tile{display:block;width:100%;aspect-ratio:4/3;min-width:0;padding:0;border:1px solid #a480d544;border-radius:12px;overflow:hidden;background:#110e19;cursor:zoom-in}.gallery-tile img,.gallery-tile iframe{display:block;width:100%;height:100%;border:0}.gallery-tile img{object-fit:cover}.gallery-tile iframe{pointer-events:none}.gallery-lightbox{max-width:min(94vw,1100px);max-height:94vh;padding:38px 12px 12px;border:1px solid #a480d577;border-radius:16px;background:#100c18;color:white}.gallery-lightbox::backdrop{background:#000d;backdrop-filter:blur(7px)}.gallery-lightbox img,.gallery-lightbox iframe{display:block;max-width:100%;width:auto;max-height:80vh;height:auto;object-fit:contain;margin:auto;border:0}.gallery-lightbox iframe{width:min(85vw,720px);height:min(70vh,520px)}.gallery-close{position:absolute;top:7px;right:10px;border:0;border-radius:8px;padding:5px 10px;background:#39234e;color:white;cursor:pointer}@media(max-width:560px){.gallery-public{grid-template-columns:repeat(2,minmax(0,1fr))}}.user-comments{display:grid;gap:12px}.user-comment{background:#100d18;border:1px solid #9e7ac13d;border-radius:13px;padding:16px}.user-comment-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.user-comment-head a{font-weight:750}.user-comment p{margin:10px 0}.comment-open{font-size:12px;color:#cba5ff} .own-profile-edit{display:inline-flex;margin-top:12px;padding:8px 13px;border:1px solid #9c77d280;border-radius:10px;background:#a982ff1a;color:#dec5ff;font-size:13px;font-weight:700;text-decoration:none}.own-profile-edit:hover{background:#a982ff30} </style></head><body><header><a href="index.html" style="font-size:19px;font-weight:750;color:#f7f2ff">Akame<span style="color:#b58bff">Development</span></a><span style="margin-left:24px"><a href="admin.html">← Admin-Panel</a></span></header><main><p class="muted">AKAMEDEVELOPMENT · BENUTZERPROFIL</p><section class="card" id="content" role="status">Profil wird geladen …</section></main><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db=createClient("https://wycdpuzlbivtfxwtarzn.supabase.co","sb_publishable_NBEO1vyOgowogxmZyr9ycA_DgObmPT0",{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById("content"),id=new URLSearchParams(location.search).get("id");
const names={modcore:"ModCore",chest:"ChestScout",crosshair:"Crosshair+",chunkloader:"ChunkLoader",items:"AkameItems",hud:"AkameHud+",info:"AkameInfos",admin:"Admin",zoom:"AkameZoom"};
function el(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n;}
try{
 if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))throw Error("Ungültiges Benutzerprofil.");
 const [{data:comments,error:commentsError},{data:gallery},{data:{user}}]=await Promise.all([
 db.from("mod_comments").select("id,project_slug,author_id,author_name,author_avatar_url,body,created_at").eq("author_id",id).order("created_at",{ascending:false}).limit(100),
 db.from("profile_gallery").select("slot,image_url").eq("user_id",id).order("slot"),
 db.auth.getUser()
 ]);
 if(commentsError)throw commentsError;
 let profile=null,community=null,role=null;
 if(user){const results=await Promise.all([
 db.from("user_profiles").select("display_name,bio,show_member_since").eq("user_id",id).maybeSingle(),
 db.from("community_profiles").select("display_name,avatar_url,created_at").eq("user_id",id).maybeSingle(),
 db.from("staff_access").select("role").eq("user_id",id).maybeSingle()
 ]);profile=results[0].data;community=results[1].data;role=results[2].data?.role;}
 const latest=comments?.[0];
 if(!latest&&!profile&&!community&&!(gallery?.length))throw Error("Für dieses Profil sind noch keine öffentlichen Informationen verfügbar.");
 root.replaceChildren();
 const person=el("div","","person"),avatar=document.createElement("img");
 const avatarUrl=community?.avatar_url||latest?.author_avatar_url||"";
 avatar.src=/^https:\/\/(cdn\.discordapp\.com|media\.discordapp\.net)\//.test(avatarUrl)?avatarUrl:"https://cdn.discordapp.com/embed/avatars/0.png";
 avatar.alt="Avatar";const info=document.createElement("div");
 info.append(el("h1",profile?.display_name||community?.display_name||latest?.author_name||"Mitglied"));
 info.append(el("div","AkameDevelopment-Profil","muted"));if(user?.id===id){const edit=el("a","✎ Profil bearbeiten","own-profile-edit");edit.href="profile.html";edit.title="Eigenes Profil bearbeiten";info.append(edit);}person.append(avatar,info);root.append(person);
 if(role)root.append(el("span",role,"pill"));
 if(profile?.bio){root.append(el("h2","Über mich"));root.append(el("p",profile.bio,"bio"));}
 if(gallery?.length){root.append(el("h2","Galerie"));const g=el("div","","gallery-public");for(const item of gallery){let match=null;try{const u=new URL(item.image_url);if(["tenor.com","www.tenor.com"].includes(u.hostname.toLowerCase()))match=u.pathname.match(/^\/view\/(?:[^/]*-)?(\d+)\/?$/);}catch{}const pic=document.createElement(match?"iframe":"img");pic.src=match?"https://tenor.com/embed/"+match[1]:item.image_url;pic.loading="lazy";pic.title="Galerie "+item.slot;if(match){pic.setAttribute("sandbox","allow-scripts allow-same-origin");pic.referrerPolicy="no-referrer";}else pic.alt="Galerie "+item.slot;const tile=el("button","","gallery-tile");tile.type="button";tile.setAttribute("aria-label","Bild "+item.slot+" vergrößern");tile.append(pic);tile.addEventListener("click",()=>{const dialog=document.createElement("dialog");dialog.className="gallery-lightbox";const close=el("button","✕","gallery-close");close.type="button";close.setAttribute("aria-label","Schließen");close.onclick=()=>dialog.close();const full=pic.cloneNode(true);if(full.tagName==="IFRAME")full.style.pointerEvents="auto";dialog.append(close,full);dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});dialog.addEventListener("close",()=>dialog.remove());document.body.append(dialog);dialog.showModal();});g.append(tile);}root.append(g);}
 if(community?.created_at&&(profile?.show_member_since!==false))root.append(el("p","Mitglied seit "+new Date(community.created_at).toLocaleDateString("de-DE"),"muted"));
 const heading=el("h2","Kommentare ("+(comments?.length||0)+")");heading.style.marginTop="32px";root.append(heading);
 if(!comments?.length)root.append(el("p","Dieser Benutzer hat noch keine Kommentare geschrieben.","muted"));
 else{const list=el("div","","user-comments");for(const comment of comments){const item=el("article","","user-comment");const head=el("div","","user-comment-head");const link=el("a",names[comment.project_slug]||comment.project_slug);link.href="project.html?mod="+encodeURIComponent(comment.project_slug)+"#mod-comments";const time=el("time",new Date(comment.created_at).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}),"muted");head.append(link,time);const body=el("p",comment.body,"bio");const open=el("a","Zur Diskussion");open.href=link.href;open.className="comment-open";item.append(head,body,open);list.append(item);}root.append(list);}
}catch(e){root.textContent=e.message||"Profil konnte nicht geladen werden."}
</script></body></html>
