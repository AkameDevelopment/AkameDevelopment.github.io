<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzerprofil · AkameDevelopment</title><link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261112-purple-anime-large-2"><link rel="shortcut icon" href="favicon.svg?v=20261112-purple-anime-large-2"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#0c0b10 0%,#15101e 50%,#100d16 100%);color:#f7f2ff;font:15px/1.6 system-ui,sans-serif}header{padding:20px max(24px,calc((100vw - 850px)/2));border-bottom:1px solid #ffffff20}a{color:#cba5ff;text-decoration:none}main{max-width:850px;margin:60px auto;padding:0 24px}.card{border:1px solid #a480d544;border-radius:20px;padding:30px;background:#1b1427}.person{display:flex;align-items:center;gap:20px}.person img{width:86px;height:86px;border-radius:22px;background:#2c2040}h1{margin:0;font-size:32px}.muted{color:#b4a4c8}.bio{white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:5px 12px;border-radius:20px;background:#4b2d68;margin:10px 8px 0 0}</style></head><body><header><a href="index.html" style="font-size:19px;font-weight:750;color:#f7f2ff">Akame<span style="color:#b58bff">Development</span></a><span style="margin-left:24px"><a href="admin.html">← Admin-Panel</a></span></header><main><p class="muted">AKAMEDEVELOPMENT · BENUTZERPROFIL</p><section class="card" id="content" role="status">Profil wird geladen …</section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://wycdpuzlbivtfxwtarzn.supabase.co","sb_publishable_NBEO1vyOgowogxmZyr9ycA_DgObmPT0",{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),root=document.getElementById("content"),id=new URLSearchParams(location.search).get("id");function el(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n;}try{const{data:{user}}=await db.auth.getUser();if(!user||!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error("Bitte melde dich an und öffne ein gültiges Benutzerprofil.");const{data:access}=await db.from("staff_access").select("role").eq("user_id",user.id).maybeSingle();if(!["owner","admin","staff"].includes(access?.role))throw Error("Du hast keine Berechtigung, fremde Profile zu öffnen.");const [p,u,s,m]=await Promise.all([db.from("community_profiles").select("display_name,avatar_url,created_at").eq("user_id",id).maybeSingle(),db.from("user_profiles").select("bio,display_name,show_member_since").eq("user_id",id).maybeSingle(),db.from("staff_access").select("role").eq("user_id",id).maybeSingle(),db.from("akamesmp_members").select("user_id").eq("user_id",id).maybeSingle()]);if(p.error||u.error||s.error||m.error)throw(p.error||u.error||s.error||m.error);if(!p.data&&!u.data)throw Error("Profil nicht gefunden.");root.replaceChildren();const person=el("div","","person"),img=document.createElement("img");const url=p.data?.avatar_url||"";img.src=/^https:\/\/(cdn\.discordapp\.com|media\.discordapp\.net)\//.test(url)?url:"https://cdn.discordapp.com/embed/avatars/0.png";img.alt="Profilbild";const info=document.createElement("div");info.append(el("h1",u.data?.display_name||p.data?.display_name||"Mitglied"));info.append(el("div","AkameDevelopment-Profil","muted"));person.append(img,info);root.append(person);root.append(el("span",s.data?.role||"Member","pill"));if(m.data)root.append(el("span","⛏ AkameSMP","pill"));root.append(el("h2","Über mich"));root.append(el("p",u.data?.bio||"Noch keine Profilbeschreibung.","bio"));const gallery=await db.from("profile_gallery").select("slot,image_url").eq("user_id",id).order("slot");if(!gallery.error&&gallery.data?.length){root.append(el("h2","Bildergalerie"));const g=document.createElement("div");g.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px";for(const item of gallery.data){const pic=document.createElement("img");pic.src=item.image_url;pic.alt="Profilbild "+item.slot;pic.loading="lazy";pic.style.cssText="width:100%;height:190px;object-fit:cover;border-radius:12px";g.append(pic);}root.append(g);}if(u.data?.show_member_since!==false&&p.data?.created_at)root.append(el("p","Mitglied seit "+new Date(p.data.created_at).toLocaleDateString("de-DE"),"muted"));}catch(e){root.textContent=e.message||"Profil konnte nicht geladen werden."}</script></body></html>
