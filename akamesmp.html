<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AkameSMP · AkameDevelopment</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#48236a55,transparent 55%),#0b0911;color:#f6f0ff;font:15px/1.6 system-ui,sans-serif}header{padding:20px max(24px,calc((100vw - 1050px)/2));border-bottom:1px solid #ffffff1a}a{color:#cba5ff;text-decoration:none}main{max-width:1050px;margin:auto;padding:55px 24px}h1{font-size:clamp(35px,6vw,62px);margin:0}h2{margin:0 0 12px}.sub{color:#b7a8c8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}.card{padding:25px;border:1px solid #8665a644;border-radius:18px;background:#1b1427;white-space:pre-wrap;overflow-wrap:anywhere}.state{padding:20px;border-radius:14px;background:#20172b;margin-top:28px}button{padding:12px 18px;border:1px solid #a780d0;border-radius:12px;background:#40245e;color:white;cursor:pointer}</style></head><body><header><a href="index.html">← AkameDevelopment</a></header><main><p class="sub">EXKLUSIVER MITGLIEDERBEREICH</p><h1>⛏️ AkameSMP</h1><p class="sub">Alles, was du für deinen Start auf unserem Minecraft-Server brauchst.</p><div id="state" class="state" role="status">Berechtigung wird geprüft …</div><div id="guide" class="cards" hidden></div></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://wycdpuzlbivtfxwtarzn.supabase.co","sb_publishable_NBEO1vyOgowogxmZyr9ycA_DgObmPT0",{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const state=document.getElementById("state"),guide=document.getElementById("guide");try{const{data:{user},error:authError}=await db.auth.getUser();if(authError||!user){state.textContent="Bitte melde dich zuerst mit Discord an.";const a=document.createElement("a");a.href="profile.html";a.textContent=" Zum Login";state.append(a);}else{const{data:member,error:memberError}=await db.from("akamesmp_members").select("user_id").eq("user_id",user.id).maybeSingle();if(memberError)throw memberError;if(!member){state.textContent="Kein Zugriff: Du benötigst die Zusatzrolle AkameSMP.";}else{const{data, error}=await db.from("akamesmp_guide").select("title,body").order("sort_order");if(error)throw error;state.hidden=true;guide.hidden=false;for(const item of data||[]){const card=document.createElement("section");card.className="card";const title=document.createElement("h2");title.textContent=item.title;const body=document.createElement("div");body.textContent=item.body;card.append(title,body);guide.append(card);}}}}catch(e){state.textContent="Der Mitgliederbereich konnte nicht geladen werden: "+(e.message||String(e));}</script></body></html>
