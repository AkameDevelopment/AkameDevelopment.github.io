name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Generate clean page URLs
        run: python3 scripts/build-pages.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # This account cannot change the repository's legacy Pages source setting.
      # Wait for that build explicitly so it cannot overwrite the generated site.
      - name: Wait for the existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" != "legacy" ]; then exit 0; fi
          PAGES_COMMIT=$(git rev-parse HEAD)
          for attempt in $(seq 1 60); do
            PAGES_BUILD_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PAGES_COMMIT}&per_page=30" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .event == "dynamic")] | if length == 0 then "missing" else .[0].status end')
            if [ "$PAGES_BUILD_STATE" = "completed" ]; then exit 0; fi
            echo "Waiting for legacy Pages build: $PAGES_BUILD_STATE"
            sleep 5
          done
          echo "The existing Pages build has not finished; refusing a competing deployment."
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
