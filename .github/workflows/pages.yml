name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing Pages site for artifact deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --silent --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - name: Generate clean page URLs
        run: python3 scripts/build-pages.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
