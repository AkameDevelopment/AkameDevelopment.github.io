name: Generate community preview image
on:
  push:
    paths:
      - '.github/workflows/community-preview.yml'
      - 'scripts/generate-community-preview.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python scripts/generate-community-preview.py
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/community-preview.png
          git diff --cached --quiet || (git commit -m "Generate community preview banner" && git push)
